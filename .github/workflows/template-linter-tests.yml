name: Template Linter Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  template-linter:
    name: template-linter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        working-directory: clients/template-linter
        run: python -m pip install --upgrade pip setuptools wheel pytest -e .

      - name: Compile Python sources
        run: python -m compileall clients/template-linter/src

      - name: Run tests
        run: python -m pytest clients/template-linter/tests
